server {
  listen 0.0.0.0:80;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  client_max_body_size 4k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok"}';
  }
  location /api/ {
    set $backend api:3000;
    proxy_pass http://$backend$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
